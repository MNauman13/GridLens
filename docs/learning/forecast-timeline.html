<section id="gridlens-phase0-timeline" aria-label="GridLens forecast availability timeline">
  <style>
    #gridlens-phase0-timeline .regions { display:grid; grid-template-columns:2fr 1fr 1fr; gap:8px; margin:20px 0 12px; }
    #gridlens-phase0-timeline .region { padding:16px 10px; background:var(--muted); color:var(--foreground); min-width:0; }
    #gridlens-phase0-timeline .region span { display:block; }
    #gridlens-phase0-timeline .region.active { background:color-mix(in srgb,var(--viz-series-1) 18%,transparent); }
    #gridlens-phase0-timeline .marker-lane { height:30px; position:relative; border-bottom:1px solid var(--border); margin-bottom:12px; }
    #gridlens-phase0-timeline .marker { position:absolute; left:0; transform:translateX(-50%); transition:left 800ms ease; color:var(--foreground); }
    #gridlens-phase0-timeline .detail { min-height:3em; }
    @media (max-width:480px) { #gridlens-phase0-timeline .regions {grid-template-columns:1fr;} }
    @media (prefers-reduced-motion:reduce) {#gridlens-phase0-timeline .marker {transition:none;} }
  </style>
  <h3>What can the model see?</h3>
  <div class="viz-controls">
    <button type="button" class="btn" data-prev disabled>Previous</button>
    <button type="button" class="btn btn-primary" data-next>Next</button>
    <span data-step class="tabular-nums">1 / 4</span>
  </div>
  <div class="regions" role="img" aria-label="Seven days of eligible context, one skipped issue day, then the 48 target intervals. All dates are UTC.">
    <div class="region active" data-region="context"><span>7-day context</span><span class="text-small">Feb 3 to Feb 10 00:00</span><span class="tabular-nums">336 observed inputs</span></div>
    <div class="region" data-region="gap"><span>Issue-day gap</span><span class="text-small">Feb 10</span><span class="tabular-nums">48 skipped intervals</span></div>
    <div class="region" data-region="target"><span>Target day</span><span class="text-small">Feb 11</span><span class="tabular-nums">48 predictions</span></div>
  </div>
  <div class="marker-lane" aria-hidden="true"><span class="marker" data-marker style="left:4%">●</span></div>
  <div class="detail" data-detail aria-live="polite">Context ends Feb 10 at 00:00 UTC. The last input starts Feb 9 at 23:30.</div>
  <script>
    (() => {
      const root = document.getElementById('gridlens-phase0-timeline');
      const prev = root.querySelector('[data-prev]');
      const next = root.querySelector('[data-next]');
      const marker = root.querySelector('[data-marker]');
      const steps = [
        {region:'context',x:4,text:'Context ends Feb 10 at 00:00 UTC. The last input starts Feb 9 at 23:30.'},
        {region:'gap',x:62,text:'Issue: Feb 10 at 09:30 UTC. Feb 10 observed demand remains excluded from inputs.'},
        {region:'target',x:87,text:'Target: Feb 11, 00:00 to 24:00 UTC. First lead: 870 minutes. Actuals are not known yet.'},
        {region:'target',x:97,text:'Simulated actual release: Feb 12 at 09:00 UTC. Only now can these errors update calibration.'}
      ];
      let index = 0;
      function draw() {
        const step = steps[index];
        root.querySelectorAll('[data-region]').forEach(el => el.classList.toggle('active',el.dataset.region === step.region));
        marker.style.left = step.x + '%';
        root.querySelector('[data-detail]').textContent = step.text;
        root.querySelector('[data-step]').textContent = (index + 1) + ' / ' + steps.length;
        prev.disabled = index === 0;
        next.disabled = index === steps.length - 1;
      }
      function move(delta) {
        index = Math.max(0,Math.min(steps.length - 1,index + delta));
        draw();
        if (window.openai && window.openai.setWidgetState) {
          window.openai.setWidgetState({modelContent:{phase:'GridLens Phase 0',step:index},privateContent:{index}}).catch(() => {});
        }
      }
      function restore(state) {
        const saved = state && state.privateContent && state.privateContent.index;
        if (Number.isInteger(saved) && saved >= 0 && saved < steps.length) {index = saved;draw();}
      }
      prev.addEventListener('click',() => move(-1));
      next.addEventListener('click',() => move(1));
      restore(window.openai && window.openai.widgetState);
      window.addEventListener('openai:set_globals',event => restore(event.detail && event.detail.globals && event.detail.globals.widgetState));
    })();
  </script>
</section>
