name: Capture source vintages
on:
  workflow_dispatch:
  schedule:
    - cron: '45 8 * * *'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m scripts.capture_prospective
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-vintage-${{ github.run_id }}
          path: reports/local/prospective/
          retention-days: 90
