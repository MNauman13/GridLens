name: Neural model verification and bounded experiments
on:
  push:
    branches: [main]
    paths: ['scripts/train_reversal.py', 'scripts/train_neural.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reversal:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'reversal')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.21
      - run: uv sync --frozen --extra ml --group dev
      - run: uv run --frozen --extra ml python scripts/train_reversal.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reversal-model-and-report
          path: reports/local/reversal
          retention-days: 90
  forecasting:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'reversal')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.21
      - run: uv sync --frozen --extra ml --group dev
      - run: mkdir -p reports/local
      - run: uv run --frozen --extra ml gridlens ingest-neso --sources 2017 2018 2019 2020 2021 2022 2023 2024 --report reports/local/live-audit.json
      - run: uv run --frozen --extra ml python -m scripts.train_neural
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: neural-pilot-models-and-reports
          path: reports/local/neural
          retention-days: 90
