name: Neural model verification and bounded experiments
on:
  push:
    branches: [main]
    paths: ['src/gridlens/models/transformer.py', 'src/gridlens/models/numeric.py', 'src/gridlens/models/timexer.py', 'scripts/train_reversal.py', 'scripts/train_neural.py', '.github/workflows/neural-phases.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reversal:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.21
      - run: uv sync --frozen --extra ml --group dev
      - run: uv run --frozen --extra ml python scripts/train_reversal.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reversal-model-and-report
          path: reports/local/reversal
          retention-days: 30
