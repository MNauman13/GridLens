name: GridLens verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gridlens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gridlens
          POSTGRES_PASSWORD: gridlens-ci
          POSTGRES_DB: gridlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gridlens -d gridlens_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      UV_PYTHON: '3.12'
      GRIDLENS_TEST_POSTGRES: 'postgresql://gridlens:gridlens-ci@127.0.0.1:5432/gridlens_test'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install uv
        run: python -m pip install uv==0.11.21
      - name: Resolve or verify Python lock
        run: uv lock --check
      - name: Install Python environment
        run: uv sync --frozen --extra api --extra ml --group dev
      - name: Resolve or install Node lock
        run: npm ci
      - name: Install verified live assets
        run: |
          node scripts/prepare_live_assets.mjs
          node scripts/prepare_baseline_assets.mjs
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Python tests and deterministic fixture
        run: |
          uv run --frozen --extra api --extra ml python -m unittest discover -s tests -v
          uv run --frozen --extra api --extra ml python scripts/phase0_check.py
          uv run --frozen --extra api --extra ml python scripts/export_schemas.py --check
          uv run --frozen --extra api --extra ml python scripts/export_settlement_demo.py --check
          uv run --frozen --extra api --extra ml python scripts/export_attention_demo.py --check
          uv run --frozen --extra api --extra ml python scripts/check_neural_reference.py
          uv run --frozen --extra api --extra ml python -m scripts.check_i0_reference
          uv run --frozen --extra api --extra ml python -m scripts.export_i2_evidence --check
          uv run --frozen --extra api --extra ml python -m scripts.export_cache_evidence --check
          uv run --frozen --extra api --extra ml gridlens fixture
      - name: Python lint and types
        run: |
          uv run --frozen --extra api --extra ml ruff check src tests scripts/reproduce_baseline.py scripts/benchmark_baseline_cold.py scripts/check_i0_reference.py scripts/prepare_live_demo.py scripts/benchmark_live.py scripts/benchmark_sdpa.py scripts/export_i2_evidence.py scripts/benchmark_cached.py scripts/run_cached_forecast.py scripts/export_cache_evidence.py scripts/release_study.py scripts/calibration_study.py scripts/load_service.py scripts/check_postgres.py scripts/benchmark_runtime.py scripts/runtime_cold.py scripts/backup_jobs.py scripts/freeze_release.py scripts/evaluate_release.py scripts/summarise_validation.py scripts/export_release_web.py scripts/prepare_release_demo.py scripts/public_smoke.py scripts/capture_prospective.py scripts/forecast_prospective.py scripts/check_monitoring_window.py scripts/container_smoke.py
          uv run --frozen --extra api --extra ml mypy src/gridlens
      - name: Node logic, lint, and types
        run: |
          npm run test:unit
          npm run lint
          npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Real browser verification
        run: npm run test:e2e
      - name: CPU tensor smoke check
        run: uv run --frozen --extra ml python -c "import torch; x=torch.tensor([1.,2.,3.],requires_grad=True); (x*x).sum().backward(); assert x.grad.tolist()==[2.,4.,6.]; print('PyTorch CPU forward/backward verified:', torch.__version__)"
      - name: Keep browser evidence and dependency locks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gridlens-verification-${{ github.sha }}
          path: |
            reports/local/
            uv.lock
            package-lock.json
          retention-days: 7

  containers:
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRIDLENS_POSTGRES_PASSWORD: gridlens-ci-container
      GRIDLENS_COOKIE_SECURE: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci
      - run: node scripts/prepare_live_assets.mjs
      - name: Build and launch PostgreSQL and API images
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Verify compute, ownership and database persistence
        run: python -m scripts.container_smoke
      - name: Capture container logs
        if: always()
        run: docker compose logs --no-color > container-logs.txt
      - name: Stop disposable containers
        if: always()
        run: docker compose down --volumes
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: container-verification-${{ github.sha }}
          path: |
            container-logs.txt
            reports/local/container-smoke.json
          retention-days: 30
