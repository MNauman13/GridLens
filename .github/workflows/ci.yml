name: GridLens verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gridlens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install uv
        run: python -m pip install uv==0.11.21
      - name: Resolve or verify Python lock
        run: |
          if test -f uv.lock; then uv lock --check; else uv lock; fi
      - name: Install Python environment
        run: uv sync --frozen --extra api --group dev
      - name: Resolve or install Node lock
        run: |
          if test -f package-lock.json; then npm ci; else npm install; fi
      - name: Emit bootstrap locks for review
        run: python scripts/emit_lockfiles.py
      - name: Python tests and deterministic fixture
        run: |
          uv run --frozen --extra api python -m unittest discover -s tests -v
          uv run --frozen --extra api python scripts/phase0_check.py
          uv run --frozen --extra api gridlens fixture
      - name: Python lint and types
        run: |
          uv run --frozen ruff check src tests/test_foundation.py
          uv run --frozen mypy src/gridlens
      - name: Node logic, lint, and types
        run: |
          npm run test:unit
          npm run lint
          npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Real browser verification
        run: npm run test:e2e
      - name: CPU tensor smoke check
        run: uv run --frozen --extra ml python -c "import torch; x=torch.tensor([1.,2.,3.],requires_grad=True); (x*x).sum().backward(); assert x.grad.tolist()==[2.,4.,6.]; print('PyTorch CPU forward/backward verified:', torch.__version__)"
      - name: Keep browser evidence and dependency locks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gridlens-verification-${{ github.sha }}
          path: |
            reports/local/
            uv.lock
            package-lock.json
          retention-days: 7
