name: Calendar portability
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/gridlens/data/dataset.py'
      - 'scripts/calendar_fingerprint.py'
      - '.github/workflows/calendar-portability.yml'
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.fingerprint.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.21
      - run: uv sync --frozen --no-dev
      - id: fingerprint
        run: uv run --frozen --no-dev python scripts/calendar_fingerprint.py --github-output
  windows:
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      EXPECTED_CALENDAR_SHA256: ${{ needs.linux.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.21
      - run: uv sync --frozen --no-dev
      - run: uv run --frozen --no-dev python scripts/calendar_fingerprint.py
