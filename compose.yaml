services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: gridlens
      POSTGRES_PASSWORD: ${GRIDLENS_POSTGRES_PASSWORD:?Set GRIDLENS_POSTGRES_PASSWORD}
      POSTGRES_DB: gridlens
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U gridlens -d gridlens]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: deployment/Dockerfile.api
    environment:
      GRIDLENS_DATABASE_URL: postgresql://gridlens:${GRIDLENS_POSTGRES_PASSWORD}@postgres:5432/gridlens
      GRIDLENS_LIVE_ASSETS: /app/artifacts/i1
      GRIDLENS_COOKIE_SECURE: ${GRIDLENS_COOKIE_SECURE:-1}
      GRIDLENS_SDPA_ENABLED: "1"
      GRIDLENS_ONNX_ENABLED: "1"
    volumes:
      - ./artifacts/i1:/app/artifacts/i1:ro
      - worker-state:/app/reports/local
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, .venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health/ready',timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  postgres-data:
  worker-state:
